name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go test -race ./...

  # Pull requests only build the images. Pushes publish them to ghcr.io:
  # main as :latest, a tag v1.2.3 as :1.2.3, and either as :sha-<commit>.
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [gateway, agent]
    # Pushes publish in order, so that :latest ends up at the newest commit.
    concurrency: images-${{ matrix.component }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build, and publish on push
        env:
          COMPONENT: ${{ matrix.component }}
          PUSH: ${{ github.event_name == 'push' }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hive-$COMPONENT"
          case "$GITHUB_REF" in
            refs/tags/v*) tag="${GITHUB_REF_NAME#v}" ;;
            *) tag=latest ;;
          esac
          docker buildx build --platform linux/amd64,linux/arm64 --push="$PUSH" \
            -t "$image:$tag" -t "$image:sha-${GITHUB_SHA::7}" -f "$COMPONENT/Dockerfile" .
